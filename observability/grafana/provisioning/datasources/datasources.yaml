apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        # Allows clicking a trace_id in Prometheus exemplars to jump to Jaeger.
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        # Links spans back to logs using the trace_id field.
        customQuery: true
        query: '{trace_id="${__trace.traceId}"}'
      nodeGraph:
        enabled: true
      spanBar:
        type: duration
