# Prometheus scrape configuration for we-sync-api local development stack.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  # Scrape metrics exported by the OTel Collector (converted from OTLP push).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Scrape metrics exposed directly by each app instance on port 9090.
  # This is the Prometheus exporter from the OTel SDK (pull model fallback).
  - job_name: we-sync-api
    static_configs:
      - targets:
          - "app1:9090"
          - "app2:9090"
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.+):.*"
        target_label: instance

  # Scrape Prometheus' own internal metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
