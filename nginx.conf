# One worker is enough for the 0.20 CPU quota ("auto" would start one per host core).
worker_processes 1;
# Each proxied request holds two descriptors (client + upstream); the container's soft limit is 1024.
worker_rlimit_nofile 32768;
# "warn" makes "worker_connections are not enough" visible (the default level is "error").
error_log /var/log/nginx/error.log warn;

events {
    # Every open client connection, idle keep-alive included, and every upstream connection uses one slot.
    # ~4 KiB of memory per open connection: keep mem_limit in docker-compose.yml in step.
    worker_connections 16384;
}

http {
    # Timeouts
    proxy_connect_timeout   5s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    send_timeout            30s;
    # Idle clients release their connection after 15s instead of 65s.
    keepalive_timeout       15s;

    # Buffer sizes
    proxy_buffer_size       4k;
    proxy_buffers           8 4k;

    # Hide the nginx version in error responses
    server_tokens off;

    # Compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # The app already logs every request (with request_id and status), so the
    # nginx access log would only duplicate that work and the disk I/O.
    access_log off;

    upstream api_backend {
        # Each instance listed once. Mark an instance as down after 3 failures
        # within 30s and keep it out for 30s before retrying
        server app1:8080 max_fails=3 fail_timeout=30s;
        server app2:8080 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    server {
        listen 80;

        # Security headers
        add_header X-Content-Type-Options  nosniff;
        add_header X-Frame-Options         DENY;

        location / {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for upstream keepalive
            proxy_set_header Connection "";
        }
    }
}
