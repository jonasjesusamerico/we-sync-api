services:
  postgres:
    image: postgres:17
    container_name: we-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 0.60
    mem_limit: 250m
    mem_reservation: 128m
    command:
      - postgres
      # ~25% do mem_limit — regra geral para shared_buffers
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      # Deve ser próximo ao mem_limit para o query planner
      # estimar corretamente o cache disponível
      - -c
      - effective_cache_size=128MB
      # 2 apps × 5 write + 5 read = 20 conexões máximas
      - -c
      - max_connections=20

  migrate:
    image: migrate/migrate:v4.17.0
    env_file:
      - .env
    container_name: we-sync-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database",
        "${DATABASE_WRITE_DSN}",
        "up"
      ]

  nginx:
    image: nginx:1.27-alpine
    container_name: we-sync-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # Sobe somente após as migrations concluírem com sucesso
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.20
    mem_limit: 32m
    mem_reservation: 16m

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: we-sync-api-1
    restart: unless-stopped
    env_file:
      - .env
    # Garante que o schema já existe antes de aceitar tráfego
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.35
    mem_limit: 100m
    mem_reservation: 64m

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: we-sync-api-2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    cpus: 0.35
    mem_limit: 100m
    mem_reservation: 64m

volumes:
  postgres_data:
