# Flow:
#   MR (into homolog or master)  → lint, test, build
#   merge into homolog           → + image :<commit>/:homolog → deploy homolog (we-sync-infra)
#   merge into master            → + semantic-release vX.Y.Z → :homolog becomes :vX.Y.Z/:production
#                                  → deploy production (manual button)

image: golang:1.27.2

default:
  interruptible: true

stages:
  - lint
  - test
  - build
  - release
  - publish
  - deploy

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  GOFLAGS: -mod=readonly
  API_IMAGE: $CI_REGISTRY_IMAGE
  MIGRATE_IMAGE: $CI_REGISTRY_IMAGE/migrate

cache:
  key:
    files:
      - go.sum
  paths:
    - .go/pkg/mod/
    - .cache/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "homolog"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Validation (every pipeline)
# ---------------------------------------------------------------------------

format:
  stage: lint
  script:
    - UNFORMATTED=$(gofmt -l $(git ls-files '*.go'))
    - if [ -n "$UNFORMATTED" ]; then echo "Arquivos sem gofmt:"; echo "$UNFORMATTED"; exit 1; fi

vet:
  stage: lint
  script:
    - go vet ./...

golangci-lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run ./...
  allow_failure: true

test:
  stage: test
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

build:
  stage: build
  script:
    - go build -o bin/app ./cmd/api
  artifacts:
    paths:
      - bin/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Docker jobs: they use the server's Docker (socket shared by the runner)
# ---------------------------------------------------------------------------

.docker:
  image: docker:cli
  cache: []
  variables:
    # Docker 29 adds attestation manifests that the GitLab registry rejects ("blob unknown to registry").
    BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

# ---------------------------------------------------------------------------
# homolog
# ---------------------------------------------------------------------------

image-homolog:
  extends: .docker
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == "homolog"
  script:
    - docker build --provenance=false --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$API_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$API_IMAGE:homolog" .
    - docker build --provenance=false -f Dockerfile.migrate -t "$MIGRATE_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$MIGRATE_IMAGE:homolog" .
    - |
      for tag in "$CI_COMMIT_SHORT_SHA" homolog; do
        docker push "$API_IMAGE:$tag"
        docker push "$MIGRATE_IMAGE:$tag"
      done

deploy-homolog:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "homolog"
  variables:
    DEPLOY_ENV: homolog
    COMPONENT: api
  trigger:
    project: saas/we-sync-infra
    branch: main
    strategy: depend

# ---------------------------------------------------------------------------
# master: version, promotion and production
# ---------------------------------------------------------------------------

# Creates the vX.Y.Z tag and the GitLab release from the commit messages since the last tag.
# Needs the GITLAB_TOKEN variable (project access token, scopes api + write_repository).
release:
  stage: release
  image: node:24-alpine
  cache: []
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git
  script:
    - touch release.env
    - npx --yes -p semantic-release -p @semantic-release/gitlab -p @semantic-release/exec semantic-release
    - cat release.env
  artifacts:
    reports:
      dotenv: release.env

# Promotes the image validated in homolog: same image, new tags.
promote:
  extends: .docker
  stage: publish
  interruptible: false
  needs: [release]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -z "$VERSION" ]; then
        echo "No feat/fix/perf commit since the last version: nothing to release."
        exit 0
      fi
      for img in "$API_IMAGE" "$MIGRATE_IMAGE"; do
        docker pull "$img:homolog"
        docker tag "$img:homolog" "$img:v$VERSION"
        docker tag "$img:homolog" "$img:production"
        docker push "$img:v$VERSION"
        docker push "$img:production"
      done
      echo "Released v$VERSION"

deploy-production:
  stage: deploy
  needs: [promote]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    DEPLOY_ENV: production
    COMPONENT: api
  trigger:
    project: saas/we-sync-infra
    branch: main
    strategy: depend
