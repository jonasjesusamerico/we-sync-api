        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: 'INVALID_PASSWORD: the password does not match'
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Delete the account
      tags:
      - users
    get:
      description: |-
        Returns the id, name, e-mail and theme of the user identified by the access token.
        theme is LIGHT, DARK or null when never chosen in the account.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Get the authenticated user
      tags:
      - users
  /users/me/password:
    put:
      consumes:
      - application/json
      description: |-
        Checks current_password and stores new_password (8 to 72 bytes, never trimmed, different from the current one).
        Every other session ends: previous refresh tokens are revoked and previous access tokens get 401.
        Returns a new token pair for the caller.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Missing or invalid authentication token
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: 'INVALID_PASSWORD: the current password does not match'
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Change the password
      tags:
      - users
