basePath: /api/v1
definitions:
  auth.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  auth.DeleteAccountRequest:
    properties:
      password:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  auth.RegisterResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  auth.Theme:
    enum:
    - LIGHT
    - DARK
    type: string
    x-enum-varnames:
    - ThemeLight
    - ThemeDark
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.UpdatePreferencesRequest:
    properties:
      theme:
        $ref: '#/definitions/auth.Theme'
    type: object
  auth.UpdateProfileRequest:
    properties:
      name:
        type: string
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      theme:
        $ref: '#/definitions/auth.Theme'
    type: object
  category.Category:
    properties:
      archived_at:
        description: null = active
        type: string
      color:
        $ref: '#/definitions/category.Color'
      created_at:
        type: string
      icon:
        $ref: '#/definitions/category.Icon'
      id:
        type: integer
      is_global:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  category.CategorySummary:
    properties:
      color:
        $ref: '#/definitions/category.Color'
      icon:
        $ref: '#/definitions/category.Icon'
      id:
        type: integer
      is_global:
        type: boolean
      name:
        type: string
    type: object
  category.Color:
    enum:
    - FOOD
    - TRANSPORT
    - HOME
    - HEALTH
    - EDUCATION
    - LEISURE
    - NEUTRAL
    type: string
    x-enum-varnames:
    - ColorFood
    - ColorTransport
    - ColorHome
    - ColorHealth
    - ColorEducation
    - ColorLeisure
    - ColorNeutral
  category.CreateCategoryRequest:
    properties:
      color:
        $ref: '#/definitions/category.Color'
      icon:
        $ref: '#/definitions/category.Icon'
      name:
        type: string
    type: object
  category.Icon:
    enum:
    - TAG
    - HEART
    - SMILE
    - BOOK
    - CAR
    - HOUSE
    - FOOD
    - CARD
    - GIFT
    - SPARKLE
    type: string
    x-enum-varnames:
    - IconTag
    - IconHeart
    - IconSmile
    - IconBook
    - IconCar
    - IconHouse
    - IconFood
    - IconCard
    - IconGift
    - IconSparkle
  category.UpdateCategoryRequest:
    properties:
      color:
        $ref: '#/definitions/category.Color'
      icon:
        $ref: '#/definitions/category.Icon'
      name:
        type: string
    type: object
  httputil.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  paymentmethod.CreatePaymentMethodRequest:
    properties:
      name:
        type: string
    type: object
  paymentmethod.PaymentMethod:
    properties:
      archived_at:
        description: null = active
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_global:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  paymentmethod.PaymentMethodSummary:
    properties:
      id:
        type: integer
      is_global:
        type: boolean
      name:
        type: string
    type: object
  paymentmethod.UpdatePaymentMethodRequest:
    properties:
      name:
        type: string
    type: object
  purchase.CategoryShare:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/category.CategorySummary'
      percent:
        description: of spent, rounded half up
        type: integer
    type: object
  purchase.Comparison:
    properties:
      current_amount:
        type: number
      percent:
        description: null only in NO_BASE
        type: integer
      period:
        $ref: '#/definitions/purchase.ComparisonPeriod'
      previous_amount:
        type: number
      previous_month:
        type: integer
      previous_until_day:
        description: |-
          PreviousUntilDay is the last day summed of the previous month in UNTIL_DAY:
          min(until_day, last day of the previous month). Null in FULL_MONTH and without a previous month.
        type: integer
      previous_year:
        type: integer
      result:
        $ref: '#/definitions/purchase.ComparisonResult'
      until_day:
        description: null in FULL_MONTH
        type: integer
    type: object
  purchase.ComparisonPeriod:
    enum:
    - UNTIL_DAY
    - FULL_MONTH
    type: string
    x-enum-varnames:
    - PeriodUntilDay
    - PeriodFullMonth
  purchase.ComparisonResult:
    enum:
    - MORE
    - LESS
    - EQUAL
    - NO_BASE
    type: string
    x-enum-comments:
      ResultEqual: rounded percent is 0
      ResultNoBase: 'previous amount is 0: no percent'
    x-enum-varnames:
    - ResultMore
    - ResultLess
    - ResultEqual
    - ResultNoBase
  purchase.CreatePurchaseRequest:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      description:
        type: string
      payment_method_id:
        type: integer
      purchase_date:
        $ref: '#/definitions/purchase.Date'
      status:
        $ref: '#/definitions/purchase.Status'
    type: object
  purchase.DailyAverage:
    properties:
      amount:
        description: rounded to the cent, half up
        type: number
      days:
        type: integer
    type: object
  purchase.Date:
    properties:
      time.Time:
        type: string
    type: object
  purchase.DayAmount:
    properties:
      amount:
        type: number
      day:
        type: integer
      forecast:
        description: current month and a day after today
        type: boolean
    type: object
  purchase.MonthOverview:
    properties:
      active_count:
        description: paid.count + pending.count
        type: integer
      categories:
        items:
          $ref: '#/definitions/purchase.CategoryShare'
        type: array
      daily:
        items:
          $ref: '#/definitions/purchase.DayAmount'
        type: array
      daily_average:
        $ref: '#/definitions/purchase.DailyAverage'
      days_in_month:
        type: integer
      is_current_month:
        type: boolean
      latest:
        items:
          $ref: '#/definitions/purchase.Purchase'
        type: array
      month:
        type: integer
      paid:
        $ref: '#/definitions/purchase.StatusTotal'
      payment_methods:
        items:
          $ref: '#/definitions/purchase.PaymentMethodShare'
        type: array
      peak_day:
        description: null only when spent is 0
        type: integer
      pending:
        $ref: '#/definitions/purchase.StatusTotal'
      spent:
        description: paid.amount + pending.amount
        type: number
      year:
        type: integer
    type: object
  purchase.MonthSummary:
    properties:
      comparison:
        $ref: '#/definitions/purchase.Comparison'
      month:
        type: integer
      purchase_count:
        description: every status
        type: integer
      spent:
        description: PAID + PENDING of the whole month
        type: number
      year:
        type: integer
    type: object
  purchase.PaginatedResult:
    properties:
      items:
        items:
          $ref: '#/definitions/purchase.Purchase'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_amount:
        type: number
      total_pages:
        type: integer
    type: object
  purchase.PaymentMethodShare:
    properties:
      amount:
        type: number
      payment_method:
        $ref: '#/definitions/paymentmethod.PaymentMethodSummary'
      percent:
        type: integer
    type: object
  purchase.Purchase:
    properties:
      amount:
        type: number
      category:
        $ref: '#/definitions/category.CategorySummary'
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      payment_method:
        $ref: '#/definitions/paymentmethod.PaymentMethodSummary'
      purchase_date:
        $ref: '#/definitions/purchase.Date'
      status:
        $ref: '#/definitions/purchase.Status'
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  purchase.Status:
    enum:
    - PENDING
    - PAID
    - CANCELED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusPaid
    - StatusCanceled
  purchase.StatusTotal:
    properties:
      amount:
        type: number
      count:
        type: integer
    type: object
  purchase.UpdatePurchaseRequest:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      description:
        type: string
      payment_method_id:
        type: integer
      purchase_date:
        $ref: '#/definitions/purchase.Date'
      status:
        $ref: '#/definitions/purchase.Status'
    type: object
host: localhost:8080
info:
  contact:
    name: Jonas Jesus Americo
    url: https://github.com/jonasjesusamerico
  description: Personal finance API — monthly purchase entries.
  title: we-sync API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Authenticate a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Revoke a refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Refresh authentication tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user. name is trimmed and must have 2 to 60 characters;
        email is trimmed and lowercased.
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/httputil.APIError'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error (name, email or password)
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Register a user
      tags:
      - auth
  /categories:
    get:
      description: |-
        Returns all categories visible to the authenticated user (global + personal), archived ones
        included; archived_at tells them apart.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/category.Category'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: |-
        Creates a personal category for the authenticated user, or reactivates the user's archived
        category with the same name (case- and accent-insensitive): the stored name is kept and the
        icon and color sent are applied.
      parameters:
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reactivated
          schema:
            $ref: '#/definitions/category.Category'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/category.Category'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "409":
          description: DEFAULT_NAME_CONFLICT or NAME_CONFLICT
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Create a personal category
      tags:
      - categories
  /categories/{id}:
    put:
      consumes:
      - application/json
      description: |-
        Replaces the name, icon and color of a personal category (active or archived) owned by the
        authenticated user.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/category.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/category.Category'
        "400":
          description: Invalid request body or ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: Cannot change a default category
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "409":
          description: DEFAULT_NAME_CONFLICT, NAME_CONFLICT or ARCHIVED_NAME_CONFLICT
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Update a personal category
      tags:
      - categories
  /categories/{id}/archive:
    delete:
      description: |-
        Reactivates an archived personal category. Reactivating an active category is a no-op
        (idempotent).
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: Cannot change a default category
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Reactivate a personal category
      tags:
      - categories
    put:
      description: |-
        Archives a personal category. Its purchases do not change. Archiving an archived category
        is a no-op (idempotent).
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: Cannot change a default category
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Archive a personal category
      tags:
      - categories
  /payment-methods:
    get:
      description: |-
        Returns all payment methods visible to the authenticated user (global + personal), archived ones
        included; archived_at tells them apart.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/paymentmethod.PaymentMethod'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: List payment methods
      tags:
      - payment-methods
    post:
      consumes:
      - application/json
      description: |-
        Creates a personal payment method for the authenticated user, or reactivates the user's archived
        payment method with the same name (case- and accent-insensitive), keeping the stored name.
        Fields other than name (such as icon and color) are ignored.
      parameters:
      - description: Payment method data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/paymentmethod.CreatePaymentMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reactivated
          schema:
            $ref: '#/definitions/paymentmethod.PaymentMethod'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/paymentmethod.PaymentMethod'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "409":
          description: DEFAULT_NAME_CONFLICT or NAME_CONFLICT
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Create a personal payment method
      tags:
      - payment-methods
  /payment-methods/{id}:
    put:
      consumes:
      - application/json
      description: Renames a personal payment method (active or archived) owned by
        the authenticated user.
      parameters:
      - description: Payment method ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated payment method data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/paymentmethod.UpdatePaymentMethodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/paymentmethod.PaymentMethod'
        "400":
          description: Invalid request body or ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: Cannot change a default payment method
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "409":
          description: DEFAULT_NAME_CONFLICT, NAME_CONFLICT or ARCHIVED_NAME_CONFLICT
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Update a personal payment method
      tags:
      - payment-methods
  /payment-methods/{id}/archive:
    delete:
      description: |-
        Reactivates an archived personal payment method. Reactivating an active payment method is a no-op
        (idempotent).
      parameters:
      - description: Payment method ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: Cannot change a default payment method
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Reactivate a personal payment method
      tags:
      - payment-methods
    put:
      description: |-
        Archives a personal payment method. Its purchases do not change. Archiving an archived payment method
        is a no-op (idempotent).
      parameters:
      - description: Payment method ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.APIError'
        "403":
          description: Cannot change a default payment method
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Archive a personal payment method
      tags:
      - payment-methods
  /purchases:
    get:
      description: |-
        Returns a paginated and filtered list of purchase entries, newest first, with the count and the
        amount (without CANCELED) of the whole filter.
      parameters:
      - description: Month (1-12)
        in: query
        name: month
        type: integer
      - description: Year (e.g. 2024)
        in: query
        name: year
        type: integer
      - description: Status
        enum:
        - PENDING
        - PAID
        - CANCELED
        in: query
        name: status
        type: string
      - description: Category ID (exact match)
        in: query
        name: category_id
        type: integer
      - description: Payment method ID (exact match)
        in: query
        name: payment_method_id
        type: integer
      - description: Text searched anywhere in the description, ignoring case and
          accents (trimmed; at most 255 characters)
        in: query
        name: q
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/purchase.PaginatedResult'
        "400":
          description: Invalid query parameter
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: page_size above 100 or q above 255 characters
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: List purchase entries
      tags:
      - purchases
    post:
      consumes:
      - application/json
      description: Creates a new monthly purchase entry.
      parameters:
      - description: Purchase entry data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/purchase.CreatePurchaseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/purchase.Purchase'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: 'CATEGORY_NOT_FOUND or PAYMENT_METHOD_NOT_FOUND: category or
            payment method not found or not accessible'
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Create a purchase entry
      tags:
      - purchases
  /purchases/{id}:
    delete:
      description: Removes a purchase entry by its ID.
      parameters:
      - description: Purchase entry ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Delete a purchase entry
      tags:
      - purchases
    get:
      description: Returns a single purchase entry identified by its ID.
      parameters:
      - description: Purchase entry ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/purchase.Purchase'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Get a purchase entry by ID
      tags:
      - purchases
    put:
      consumes:
      - application/json
      description: Replaces all fields of an existing purchase entry.
      parameters:
      - description: Purchase entry ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated purchase data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/purchase.UpdatePurchaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/purchase.Purchase'
        "400":
          description: Invalid request body or ID
          schema:
            $ref: '#/definitions/httputil.APIError'
        "404":
          description: 'NOT_FOUND: purchase not found; CATEGORY_NOT_FOUND or PAYMENT_METHOD_NOT_FOUND:
            category or payment method not found or not accessible'
          schema:
            $ref: '#/definitions/httputil.APIError'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Update a purchase entry
      tags:
      - purchases
  /purchases/overview:
    get:
      description: |-
        KPIs, spending per day, per category and per payment method (PAID + PENDING of the whole month)
        and the 6 latest purchases of any status, all read from one database snapshot. today is the
        client's local date: it decides the current month, the daily average and the forecast days.
      parameters:
      - description: Year (1-9999)
        in: query
        name: year
        required: true
        type: integer
      - description: Month (1-12)
        in: query
        name: month
        required: true
        type: integer
      - description: Client local date (YYYY-MM-DD)
        in: query
        name: today
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/purchase.MonthOverview'
        "400":
          description: Missing or invalid year, month or today
          schema:
            $ref: '#/definitions/httputil.APIError'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Month overview of the home page
      tags:
      - purchases
  /purchases/summary:
    get:
      description: |-
        Spent amount of the month (PAID + PENDING, every day of the month) and the comparison with the
        previous month over the same period: up to today's day when the month is today's month, else the
        whole months. today is the client's local date and only decides the period.
        previous_until_day is the last day summed of the previous month (null in FULL_MONTH).
      parameters:
      - description: Year (1-9999)
        in: query
        name: year
        required: true
        type: integer
      - description: Month (1-12)
        in: query
        name: month
        required: true
        type: integer
      - description: Client local date (YYYY-MM-DD)
        in: query
        name: today
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/purchase.MonthSummary'
        "400":
          description: Missing or invalid year, month or today
          schema:
            $ref: '#/definitions/httputil.APIError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/httputil.APIError'
      summary: Month spending summary
      tags:
      - purchases
  /users/me:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes the account and all its data (purchases, own categories and payment methods, sessions). It cannot be undone.
        The password confirms the operation and is never trimmed.
      parameters:
      - description: Password confirmation
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid or missing request body
